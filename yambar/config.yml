fontmain: &fontmain Liga DejaVu Sans Mono:pixelsize=18
awesome: &awesome Font Awesome 6 Free:style=solid:pixelsize=18
bg: &bg {background: {color: 000000ff}}
bg_focused: &bg_focused {background: {color: 080808ff}}
bar:
  height: 24
  location: top
  background: 000000ff
  font: *fontmain

  left:
    - river:
        anchors:
          - base: &river_base
              left-margin: 10
              right-margin: 10
              default: {string: {text: , font: *fontmain}}
              conditions:
                id == 1: {string: {text: 1, font: *fontmain}}
                id == 2: {string: {text: 2, font: *fontmain}}
                id == 3: {string: {text: 3, font: *fontmain}}
                id == 4: {string: {text: 4, font: *fontmain}}
                id == 5: {string: {text: 5, font: *fontmain}}
                id == 6: {string: {text: 6, font: *fontmain}}
        content:
          map:
            on-click:
              left: sh -c "riverctl set-focused-tags $((1 << ({id} - 1)))"
              right: sh -c "riverctl toggle-focused-tags $((1 << ({id} -1)))"
              middle: sh -c "riverctl toggle-view-tags $((1 << ({id} -1)))"
            conditions:
              state == urgent:
                map:
                  <<: *river_base
                  deco: {background: {color: D08770ff}}
              state == focused:
                map:
                  <<: *river_base
                  deco: {underline: {size: 3, color: ea6962ff}}
              state == visible && ~occupied:
                map:
                  <<: *river_base
              state == visible && occupied:
                map:
                  <<: *river_base
                  deco: *bg
              state == unfocused:
                map:
                  <<: *river_base
                  deco: *bg
              state == invisible && ~occupied: 
                map:
                  <<: *river_base
                  deco: *bg
              state == invisible && occupied:
                map:
                  <<: *river_base
                  deco: *bg
  right:
    - network:
        content:
          map:
            default: {empty: {}}
            conditions:
              name == eth0:
                map:
                  conditions:
                    ~carrier: {empty: {}}
                    carrier:
                      map:
                        default: {string: {text: , font: *awesome, foreground: ffffff66, right-margin: 8}}
                        conditions:
                          state == up && ipv4 != "": {string: {text: , font: *awesome, right-margin: 8}}
    - alsa:
        card: hw:PCH
        mixer: Master
        content:
          map:
            conditions:
              ~online: {string: {text: , font: *awesome, foreground: ff0000ff, right-margin: 8}}
              online:
                map:
                  on-click: /bin/sh -c "pavucontrol"
                  conditions:
                    muted: {string: {text: , font: *awesome, foreground: ffffff66, right-margin: 8}}
                    ~muted:
                      ramp:
                        tag: percent
                        items:
                          - string: {text: , font: *awesome, right-margin: 8}
                          - string: {text: , font: *awesome, right-margin: 8}
                          - string: {text: , font: *awesome, right-margin: 8}
    - clock:
        time-format: "%H:%M %Z"
        content:
          - string: {text: , font: *awesome, right-margin: 8}
          - string: {text: "{date}", right-margin: 8}
          - string: {text: , font: *awesome, right-margin: 8}
          - string: {text: "{time}", right-margin: 8}
    - label:
        content:
          string:
            on-click: systemctl poweroff
            text: 
            font: *awesome


